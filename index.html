<!doctype html>
<html lang="zh-HK">
<head>
<meta charset="utf-8">

<title>校園橫額設計總覽</title>

<style>
:root{color-scheme:light;--ink:#163f38;--paper:#f8f7f1;--rule:#c5cec0;font-family:"PingFang HK","Microsoft JhengHei",system-ui,sans-serif;color:var(--ink);background:var(--paper)}
*{box-sizing:border-box}
body{margin:0}
a{color:inherit;text-underline-offset:.25em}
a:focus-visible{outline:3px solid #be682e;outline-offset:4px}
.top{background:#183f38;color:#faf8ed}
.wrap{width:min(1220px,92%);margin-inline:auto}
.bar{display:flex;align-items:center;justify-content:space-between;gap:14px;min-height:64px}
.brand{font-weight:700;letter-spacing:.1em}
nav{display:flex;gap:24px}
nav a{padding:12px 0;text-decoration:none;font-size:14px}
nav a:hover,.links a:hover{text-decoration:underline}
main{padding:44px 0 48px}
h1,h2,h3,p{margin:0}
h1,h2,h3{font-family:"Songti TC","Noto Serif CJK TC",serif}
h1{font-size:clamp(36px,4.4vw,66px);line-height:1.14;letter-spacing:.035em}
.lead{margin:14px 0 34px;line-height:1.7;color:#51645c}
h2{font-size:clamp(23px,2vw,31px)}
#inside,#outside{scroll-margin:12px}
.section-title{display:flex;align-items:center;gap:18px;margin-bottom:16px}
.section-title::after{content:"";height:1px;flex:1;background:var(--rule)}
.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}
.card{display:flex;flex-direction:column;min-width:0;overflow:hidden;border:1px solid var(--rule);border-radius:9px;background:#fffefa;text-decoration:none}
.card img{width:100%;height:auto;aspect-ratio:640/340;object-fit:cover;display:block}
.caption{padding:14px 15px 18px;flex:1;position:relative}
.caption small{font-size:14px;color:#51675e}
.caption h3{margin-top:6px;padding-right:18px;font-size:clamp(19px,1.7vw,25px);line-height:1.45;letter-spacing:.015em}
.caption::after{content:"›";position:absolute;right:13px;bottom:18px;font:26px/1 Georgia;color:#446658}
.card:hover{border-color:#527f6e;background:#f1f5eb}
#outside{margin-top:36px}
.facade{display:grid;grid-template-columns:minmax(240px,.68fr) 1.4fr;border:1px solid #d1c4ad;background:#f3eede;border-radius:10px;overflow:hidden}
.desc{display:flex;flex-direction:column;justify-content:center;align-items:flex-start;gap:12px;padding:clamp(18px,2.7vw,38px)}
.desc h3{font-size:clamp(24px,2.3vw,34px);line-height:1.4}
.desc p{color:#5b5141;font-size:15px}
.links{display:flex;flex-wrap:wrap;align-items:center;gap:12px 18px;margin-top:5px}
.open{border-radius:5px;background:#214b40;color:#fffaf2;padding:10px 16px;text-decoration:none;font-weight:600}
.pdf{font-size:14px}
.facade-visual{align-self:center;display:block;padding:12px}
.facade img{display:block;width:100%;height:auto}
@media(max-width:900px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.facade{grid-template-columns:.9fr 1.2fr}}
@media(max-width:600px){main{padding:28px 0}.bar{min-height:56px}nav{gap:13px}.lead{margin:10px 0 23px}.grid{gap:10px}.caption{padding:10px}.caption h3{font-size:18px;padding-right:10px}.caption::after{right:7px;bottom:12px;font-size:20px}.facade{grid-template-columns:1fr}.facade-visual{order:-1;padding:9px}.desc{padding:8px 17px 21px;gap:8px}#outside{margin-top:26px}}
</style>
</head>
<body><header class="top"><div class="wrap bar"><div class="brand">校園環境設計</div><nav aria-label="設計類別"><a href="#inside">內牆長廊</a><a href="#outside">外牆橫額</a></nav></div></header>

<a class="card" href="./floor-5.html"><img src="./gallery/floor-5.webp" width="640" height="340" alt=""><div class="caption"><small>五樓</small><h3>二十四節氣・四時流轉</h3></div></a>

</main></body></html>
