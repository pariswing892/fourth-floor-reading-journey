<!doctype html>
<html lang="zh-HK"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#242737"><link rel="icon" href="data:,"><title>四層外牆橫額｜校園設計工作室</title><link rel="stylesheet" href="style.css?v=photo-pan-1"></head>
<body>
<header><div class="bar"><div class="brand"><svg viewBox="0 0 38 33" aria-hidden="true"><path d="M1 8 23 1l14 5-23 7Z" fill="#D9BEFD"/><path d="m1 14 13 5 23-7" class="band" stroke="#FABF84"/><path d="m1 20 13 5 23-7" class="band" stroke="#8CC5F3"/><path d="m1 26 13 5 23-7" class="band" stroke="#FA9C94"/></svg><b>校園設計工作室</b><span>外牆橫額</span></div><button id="exportToggle" class="primary" aria-expanded="false">匯出設計 <span aria-hidden="true">↓</span></button></div></header>
<main><div class="intro"><div><div class="folio">校園環境設計 <i>/</i> 第一階段審閱</div><h1>四層外牆橫額</h1></div><div class="spec"><strong>774 <em>×</em> 58</strong><span>每層實體尺寸 · 吋</span></div></div>
<section id="exports" class="panel" hidden><h2>匯出設計</h2><div class="actions"><button data-export="layers">本層分層 SVG 初稿</button><button data-export="full">本層全幅 PNG</button><button data-export="detail">本區放大 PNG</button><button data-export="board">校長審閱圖 PNG</button><button data-export="draft">下載可編輯草稿</button></div></section>
<div class="schemebar"><div class="modes" id="modes"><button data-mode="overview">四層總覽</button><button data-mode="full">全幅預覽</button><button data-mode="detail">分區放大</button></div><div class="schemes"><button data-scheme="A"><b>A</b> 清新專業</button><button data-scheme="B"><b>B</b> 活力動感</button><button data-scheme="C"><b>C</b> 紙上展廊</button><button data-scheme="D"><b>D</b> 跑道節拍</button></div></div>
<div class="titleChoices"><div id="bTitles" class="cTitleOptions" role="group" aria-label="B 版中央構圖" hidden><strong>中央構圖</strong><div class="schemes"><button data-b-title="plain">原版白字</button><button data-b-title="reference">揮筆題字・暖白</button><button data-b-title="sweep">揮筆題字・樓層色</button></div></div><div id="cTitles" class="cTitleOptions" role="group" aria-label="C 版中央構圖" hidden><strong>中央構圖</strong><div class="schemes"><button data-c-title="fold">C1　摺紙題簽</button><button data-c-title="press">C2　活字海報</button></div></div><label>標語字體 <select id="titleFace"><option value="seki">源石黑體（丹版）</option><option value="song">繁體粗宋</option><option value="sans">原版粗黑</option></select></label></div>
<div id="photoSets" class="titleChoices" hidden><strong>已選活動相片</strong><div class="schemes"><button data-photo-set="main">主配搭</button><button data-photo-set="alternate">替換配搭</button></div></div>
<section class="viewer"><div class="toolbar"><h2 id="viewTitle"></h2><div class="tools"><label><input type="checkbox" id="center"> 中心線</label><label><input type="checkbox" id="safety"> 安全線／出血</label><div class="zoom"><button id="minus" aria-label="縮小">−</button><output id="scale">100%</output><button id="plus" aria-label="放大">＋</button></div></div></div>
<div class="mat"><div id="view" class="viewport" tabindex="0" aria-label="外牆設計預覽，可橫向捲動"></div></div>
<div class="legend"><span id="viewHint"></span><span id="guideHint"></span></div></section>
<section class="navigation"><h2>樓層導覽</h2><nav id="floors" aria-label="選擇樓層"></nav><div id="regions" class="actions" aria-label="選擇放大區域" hidden></div></section>
<div class="editbar"><button id="editToggle" aria-expanded="false">編輯文字與素材</button><button id="boardToggle" aria-expanded="false">檢視校長審閱圖</button></div>
<section id="editor" class="panel" hidden><h2>編輯橫額</h2><div class="fields"><label>目前樓層<select id="level"></select></label><label>主標語（四字）<input id="headline" maxlength="8" required><span id="titleHint"></span></label><label>主題色調<select id="tone"></select></label><label>標語字級 <output id="fontOut"></output><input type="range" id="font" min="64" max="86"></label><label>字距 <output id="trackOut"></output><input type="range" id="track" min="4" max="17"></label></div>
<h3>活動照片</h3><div id="photoEditors" class="photoEditors"></div>
<h3>印刷參考線 <small>暫定值，待印刷公司與現場確認</small></h3><div class="fields"><label>安全邊距（吋）<input id="margin" type="number" min="0" max="20" step=".25"></label><label>出血（吋）<input id="bleed" type="number" min="0" max="10" step=".25"></label></div>
<h3>可編輯草稿</h3><div class="actions"><button data-export="draft">下載草稿 JSON</button><label class="filebtn">載入草稿 JSON<input type="file" id="restore" accept=".json,application/json"></label></div></section>
<section id="boardPanel" class="panel" hidden><div class="boardHead"><h2>校長審閱圖</h2><button data-export="board">下載審閱圖 PNG</button></div><div id="boardView"></div></section>
<p role="status" id="status"></p></main>
<svg id="measure" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"></svg>
<script defer src="fonts/seki-data.js"></script><script defer src="art.js"></script><script defer src="design.js?v=photo-pan-1"></script><script defer src="review.js"></script><script defer src="app.js?v=photo-pan-1"></script></body></html>
